services:
  - type: web
    name: evalpro-api
    runtime: python
    region: oregon
    plan: free

    # Backend only — no Node/frontend build here.
    # Frontend is deployed separately on Vercel.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DEBUG
        value: "true"
      - key: APP_NAME
        value: "EvalPro API"
      - key: ALLOWED_ORIGINS
        value: '["https://ai-exam-evaluator-nine.vercel.app","http://localhost:5173"]'

      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_MAX_TOKENS
        value: "1500"
      - key: GROQ_TEMPERATURE
        value: "0.2"

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_MAX_TOKENS
        value: "8192"

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: "answercheck"

      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
